name: CI
on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # ponytail: the Linux build needs webkit for the window; the test job runs on Linux too.
  APT_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  version-bumped:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin "$GITHUB_BASE_REF" --depth=1
      - name: version in Cargo.toml must differ from base branch
        run: |
          base=$(git show "origin/$GITHUB_BASE_REF:src-tauri/Cargo.toml" | grep -m1 '^version = ')
          head=$(grep -m1 '^version = ' src-tauri/Cargo.toml)
          echo "base: $base"; echo "head: $head"
          [ "$base" != "$head" ] || { echo "::error::Bump version in Cargo.toml before merging"; exit 1; }

  release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Release v$VERSION unless the tag already exists
        run: |
          tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          gh release view "$tag" >/dev/null 2>&1 && { echo "$tag already released"; exit 0; }
          gh release create "$tag" --generate-notes

  # ponytail: one binary per OS as a release asset, named the way update::asset_name() looks for it.
  # Plain cargo build, no tauri-cli/npm: the frontend is checked-in HTML, nothing to bundle.
  binaries:
    if: github.event_name == 'push'
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: gitdashy-linux-x86_64
          - os: macos-latest
            asset: gitdashy-macos-arm64
          - os: macos-13
            asset: gitdashy-macos-x86_64
          - os: windows-latest
            asset: gitdashy-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo build --release
        working-directory: src-tauri
      - shell: bash
        run: |
          tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          ext=; [ "$RUNNER_OS" = Windows ] && ext=.exe
          cp "src-tauri/target/release/gitdashy$ext" "${{ matrix.asset }}"
          gh release upload "$tag" "${{ matrix.asset }}" --clobber
