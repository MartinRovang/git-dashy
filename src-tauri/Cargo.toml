[package]
name = "gitdashy"
version = "2.35.10"
edition = "2021"
description = "PR dashboard with Claude reviews and shared team memory"
license = "MIT"
repository = "https://github.com/MartinRovang/github-dashy"
default-run = "gitdashy"

[lib]
name = "gitdashy"
path = "src/lib.rs"

[[bin]]
name = "gitdashy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
fs4 = "0.13"
getrandom = "0.3"
include_dir = "0.7"
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
simplelog = "0.12"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
urlencoding = "2"

# the app window's engine on Linux, already under tauri; direct only to turn off its click-to-play rule
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# A dev binary carries debuginfo for the whole graph, tauri and webkit included, and cargo keeps
# every superseded copy rather than collecting it: 322 of them filled a disk in a week (#172).
# Dropping it for dependencies takes the per-build footprint of our own artifacts from 413 MB to
# 238 MB. It costs only stepping a debugger into a dependency's source — our own frames, where a
# panic in this crate is read, keep their line numbers.
[profile.dev.package."*"]
debug = false
