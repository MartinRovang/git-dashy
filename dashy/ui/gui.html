<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>gitdashy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #141017; --bg2: #17121c; --bg3: #1b1520; --bg4: #221a28;
    --line: #2e2436; --line2: #241c2b; --edge: #372c41;
    --ink: #ece7f1; --ink2: #cfc6d8; --ink3: #b7adc2; --dim: #9c92a8; --dim2: #6f6579; --dim3: #5d5468;
    --pink: #f56bb0; --green: #4fd48c; --red: #f0655c; --amber: #dfb03c; --cyan: #5fc4d9; --violet: #c58cf0;
    --sel: #231a2b; --addbg: rgba(79,212,140,0.10); --delbg: rgba(240,101,92,0.10); --markbg: rgba(255,255,255,0.06);
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }
  /* ponytail: a theme swaps the accents and the greys, nothing else — the same rule the curses THEMES table had. */
  body[data-theme="dracula"] { --bg: #282a36; --bg2: #262837; --bg3: #2b2d3a; --bg4: #343746; --line: #3b3d4d; --line2: #33354a; --edge: #44475a;
    --ink: #f8f8f2; --ink2: #e2e2dc; --ink3: #c9c9c3; --dim: #a5a5a0; --dim2: #6272a4; --dim3: #565b80;
    --pink: #ff79c6; --green: #50fa7b; --red: #ff5555; --amber: #f1fa8c; --cyan: #8be9fd; --violet: #bd93f9; --sel: #343746; }
  body[data-theme="gruvbox"] { --bg: #282828; --bg2: #262626; --bg3: #2e2e2e; --bg4: #3c3836; --line: #3c3836; --line2: #353230; --edge: #504945;
    --ink: #ebdbb2; --ink2: #d5c4a1; --ink3: #bdae93; --dim: #a89984; --dim2: #7c6f64; --dim3: #665c54;
    --pink: #d3869b; --green: #b8bb26; --red: #fb4934; --amber: #fabd2f; --cyan: #83a598; --violet: #d3869b; --sel: #3c3836; }
  body[data-theme="nord"] { --bg: #2e3440; --bg2: #2c323d; --bg3: #323947; --bg4: #3b4252; --line: #3b4252; --line2: #363d4c; --edge: #434c5e;
    --ink: #eceff4; --ink2: #e5e9f0; --ink3: #d8dee9; --dim: #a3aab8; --dim2: #6c7687; --dim3: #5b6474;
    --pink: #b48ead; --green: #a3be8c; --red: #bf616a; --amber: #ebcb8b; --cyan: #88c0d0; --violet: #b48ead; --sel: #3b4252; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  a { color: var(--pink); text-decoration: none; }
  ::selection { background: rgba(245,107,176,0.3); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }
  @keyframes spin { to { transform: rotate(360deg) } }
  .scroll::-webkit-scrollbar { width: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  #app { height: 100%; display: flex; flex-direction: column; }
  .mono { font-family: var(--mono); }
  kbd { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--dim); min-width: 16px; height: 16px; padding: 0 3px;
        border-radius: 4px; background: var(--line); display: inline-flex; align-items: center; justify-content: center; }
  .hidekeys kbd.hint { display: none; }

  /* top bar */
  .top { height: 44px; flex-shrink: 0; background: var(--bg3); border-bottom: 1px solid var(--line);
         display: flex; align-items: center; gap: 14px; padding: 0 14px; }
  .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--pink); display: grid; place-items: center; overflow: hidden; }
  .logo img { width: 17px; display: block; }
  .brand { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .vbar { width: 1px; height: 18px; background: var(--line); }
  .pill { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-radius: 6px;
          background: rgba(79,212,140,0.09); border: 1px solid rgba(79,212,140,0.25); font-size: 11px; font-weight: 600; color: var(--green); }
  .pill.busy { background: rgba(95,196,217,0.10); border-color: rgba(95,196,217,0.28); color: var(--cyan); }
  .pill.err { background: rgba(240,101,92,0.10); border-color: rgba(240,101,92,0.28); color: var(--red); }
  .pill.up { background: rgba(79,212,140,0.16); cursor: pointer; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .toggle { height: 26px; display: flex; align-items: center; gap: 7px; padding: 0 10px 0 8px; border-radius: 6px;
            border: 1px solid var(--edge); background: var(--bg4); cursor: pointer; }
  .toggle:hover { border-color: var(--dim3); }
  .track { width: 22px; height: 12px; border-radius: 7px; padding: 2px; background: var(--edge); transition: background .15s; }
  .track i { display: block; width: 8px; height: 8px; border-radius: 50%; background: #fff; transition: margin-left .15s; }
  .toggle.on .track { background: var(--green); }
  .toggle.on .track i { margin-left: 10px; }
  .toggle span { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--dim2); }
  .toggle.on span { color: var(--green); }
  .ib { height: 26px; width: 30px; border-radius: 6px; border: 1px solid var(--edge); background: var(--bg4); color: var(--ink3);
        display: grid; place-items: center; cursor: pointer; font-size: 14px; }
  .ib:hover { border-color: var(--dim3); color: var(--ink); }

  .body { flex: 1; min-height: 0; display: flex; }

  /* sidebar */
  .side { width: 236px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; padding: 14px 10px; overflow-y: auto; gap: 0; }
  .cap { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--dim3); padding: 0 8px 8px; }
  .nav { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 7px; cursor: pointer; }
  .nav:hover { background: var(--bg4); }
  .nav i { width: 6px; height: 6px; border-radius: 2px; background: var(--dim3); }
  .nav b { font-size: 13px; font-weight: 500; color: var(--ink3); flex: 1; min-width: 0; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  .nav em { font-family: var(--mono); font-style: normal; font-size: 11px; color: var(--dim2); }
  .rule { height: 1px; background: var(--line); margin: 12px 8px; flex-shrink: 0; }
  .stat { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
  .stat span { font-size: 12px; color: var(--dim); }
  .stat b { font-family: var(--mono); font-size: 12px; font-weight: 600; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; background: var(--bg3); margin-top: 10px; flex-shrink: 0; }
  .card .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 3px 0; min-height: 24px; }
  .card .row span { font-size: 11px; color: var(--dim2); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .card .row b { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--ink); text-align: right;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .card .row b.link { cursor: pointer; color: var(--ink2); }
  .card .row b.link:hover { color: var(--pink); }
  .card .row b.on { color: var(--amber); }
  .card .row b.err { color: var(--red); }
  /* ponytail: a <select>. The design draws pill options per setting, which is a popover, a focus trap and an
     escape key once it has to work — the platform ships all three. */
  .card .row select { font-family: var(--mono); font-size: 11px; color: var(--ink); background: var(--bg4);
                      border: 1px solid var(--edge); border-radius: 5px; padding: 1px 4px; cursor: pointer; max-width: 120px; }
  .card .row select:hover { border-color: var(--dim3); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .chips i { font-family: var(--mono); font-style: normal; font-size: 10px; padding: 1px 6px; border-radius: 9px; cursor: pointer;
             border: 1px solid var(--edge); color: var(--dim2); background: var(--bg4); }
  .chips i.on { color: var(--pink); border-color: rgba(245,107,176,0.5); background: rgba(245,107,176,0.12); }
  .note { font-size: 11px; color: var(--amber); padding: 2px 0; white-space: normal; line-height: 1.35; }

  /* queue */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .queue { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bar { height: 56px; flex-shrink: 0; border-bottom: 1px solid var(--line); display: flex; align-items: center;
         gap: 10px; padding: 0 18px; }
  .search { display: flex; align-items: center; gap: 8px; height: 32px; width: 300px; padding: 0 11px;
            border-radius: 7px; background: var(--bg3); border: 1px solid var(--line); }
  .search input { flex: 1; background: transparent; border: none; outline: none; color: var(--ink);
                  font-family: var(--sans); font-size: 12.5px; min-width: 0; }
  .chip { height: 30px; padding: 0 11px; border-radius: 7px; display: flex; align-items: center; gap: 7px;
          cursor: pointer; font-size: 12px; font-weight: 500; border: 1px solid var(--line); background: var(--bg3); color: var(--ink3); }
  .chip em { font-family: var(--mono); font-style: normal; font-size: 11px; opacity: 0.6; }
  .chip.on { background: rgba(245,107,176,0.12); border-color: rgba(245,107,176,0.4); color: var(--pink); }

  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 20px; }
  .head { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 18px; cursor: pointer;
          position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .head .caret { font-family: var(--mono); font-size: 10px; color: var(--dim2); width: 9px; }
  .head .label { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; }
  .head .count { font-family: var(--mono); font-size: 11px; color: var(--dim2); }
  .head .fill { flex: 1; height: 1px; background: var(--line2); }
  .head .hint { font-size: 11px; color: var(--dim3); }
  .group { display: flex; align-items: center; gap: 8px; padding: 6px 18px 2px 46px; font-family: var(--mono); font-size: 10px; color: var(--dim3); }
  .group i { flex: 1; height: 1px; background: var(--line2); }

  .pr { display: flex; align-items: center; gap: 12px; padding: 9px 18px 9px 16px; cursor: pointer;
        border-left: 2px solid transparent; }
  .pr:hover { background: var(--bg3); }
  .twist { width: 24px; flex-shrink: 0; display: flex; align-items: center; gap: 3px; font-family: var(--mono);
           font-size: 10px; color: var(--dim2); }
  .twist[data-expand] { cursor: pointer; }
  .twist[data-expand]:hover { color: var(--pink); }
  .twist em { font-style: normal; font-size: 10px; }
  .pr.child { padding-left: 40px; background: rgba(0,0,0,0.18); }
  .pr.child .txt b { font-weight: 400; color: var(--ink3); }
  .pr.child:hover { background: var(--bg3); }
  .pr.child.sel { background: var(--sel); }
  .pr.sel { background: var(--sel); border-left-color: var(--pink); }
  .pr .age { font-family: var(--mono); font-size: 11px; color: var(--dim2); width: 34px; flex-shrink: 0; }
  .pr .repo { font-family: var(--mono); font-size: 11px; color: var(--dim); width: 74px; flex-shrink: 0;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr .num { font-family: var(--mono); font-size: 12px; color: var(--pink); width: 50px; flex-shrink: 0; }
  .pr .txt { flex: 1; min-width: 0; }
  .pr .txt b { display: block; font-size: 13px; font-weight: 500; color: var(--ink);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr.sel .txt b { color: #fff; }
  .pr .sub { font-size: 11.5px; color: var(--dim2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; font-style: italic; }
  .who { display: flex; align-items: center; gap: 7px; width: 132px; flex-shrink: 0; }
  .who span { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av { width: 20px; height: 20px; border-radius: 50%; color: var(--bg); font-size: 10px; font-weight: 700;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .revs { display: flex; gap: 4px; width: 92px; flex-shrink: 0; overflow: hidden; }
  .rev { height: 20px; padding: 0 7px; border-radius: 10px; display: flex; align-items: center;
         font-family: var(--mono); font-size: 10px; font-weight: 600; }
  .end { width: 170px; flex-shrink: 0; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .state { height: 22px; padding: 0 9px; border-radius: 6px; display: flex; align-items: center;
           font-family: var(--mono); font-size: 11px; font-weight: 600; white-space: nowrap; }
  .bar-run { width: 44px; height: 4px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar-run i { display: block; height: 4px; border-radius: 3px; background: var(--cyan); animation: pulse 1.2s ease-in-out infinite; }
  .ci { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .none { font-family: var(--mono); font-size: 12px; color: var(--dim3); padding: 4px 18px 10px 46px; }
  .none.err { color: var(--red); }
  .splash { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 100%; color: var(--dim); }
  .splash .logo { width: 64px; height: 64px; border-radius: 16px; }
  .splash .logo img { width: 50px; }

  /* side pane */
  .pane { width: 420px; flex-shrink: 0; border-left: 1px solid var(--line); background: var(--bg2);
          display: flex; flex-direction: column; }
  .pane .bar { padding: 0 14px; gap: 6px; }
  .tab { height: 26px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; cursor: pointer;
         font-family: var(--mono); font-size: 11px; color: var(--dim2); border: 1px solid transparent; }
  .tab.on { color: var(--ink); background: var(--bg4); border-color: var(--edge); }
  .btn { height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--edge); display: inline-flex;
         align-items: center; gap: 6px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--ink2); background: transparent; white-space: nowrap; }
  .btn:hover { background: var(--bg4); border-color: var(--dim3); }
  .btn.go { background: var(--pink); border-color: var(--pink); color: #241021; font-weight: 600; }
  .btn.go:hover { filter: brightness(1.1); }
  .btn.warn { border-color: rgba(240,101,92,0.5); color: var(--red); }
  .pane .in { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 22px; }
  .crumbs { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--dim2); }
  .ptitle { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1.25; margin-top: 9px; text-wrap: pretty; }
  .sep { height: 1px; background: var(--line); margin: 18px 0; }
  .lab { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--dim3); }
  .prose { font-size: 13px; line-height: 1.55; color: var(--ink3); margin-top: 8px; text-wrap: pretty; }
  .check { display: flex; align-items: center; gap: 9px; }
  .check span { font-size: 12.5px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .check em { font-family: var(--mono); font-style: normal; font-size: 11px; color: var(--dim2); margin-left: auto; }
  .find { display: flex; gap: 11px; }
  .find i { width: 3px; border-radius: 2px; flex-shrink: 0; }
  .find .tag { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; }
  .find .loc { font-family: var(--mono); font-size: 11px; color: var(--dim2); }
  .find p { font-size: 13px; line-height: 1.55; color: var(--ink2); margin: 4px 0 0; text-wrap: pretty; }
  .act { height: 38px; border-radius: 8px; border: 1px solid var(--edge); background: var(--bg3); display: flex;
         align-items: center; gap: 10px; padding: 0 12px; cursor: pointer; }
  .act:hover { background: var(--bg4); border-color: var(--dim3); }
  .act b { font-size: 13px; font-weight: 500; color: var(--ink2); }
  .act em { font-style: normal; font-size: 11.5px; color: var(--dim3); margin-left: auto; white-space: nowrap; }
  .act.go { background: var(--pink); border-color: var(--pink); }
  .act.go:hover { filter: brightness(1.1); }
  .act.go kbd { color: rgba(20,16,23,0.6); background: rgba(20,16,23,0.18); }
  .act.go b { color: #241021; font-weight: 600; }
  .act.go em { font-family: var(--mono); color: rgba(36,16,33,0.6); }
  .act.off { opacity: 0.45; pointer-events: none; }

  /* code tab */
  .code { font-family: var(--mono); font-size: 11.5px; line-height: 1.45; }
  .code .file { display: flex; gap: 8px; color: var(--cyan); font-weight: 600; margin-top: 10px; padding: 2px 0; }
  .code .file em { font-style: normal; color: var(--dim2); font-weight: 400; margin-left: auto; }
  .code .hunk { color: var(--dim3); padding: 2px 0; }
  .code .ln { display: flex; gap: 6px; white-space: pre; padding: 0 4px; border-radius: 3px; }
  .code .ln.add { background: var(--addbg); color: var(--green); }
  .code .ln.del { background: var(--delbg); color: var(--red); }
  .code .ln.marked { background: var(--markbg); color: var(--ink); }
  .code .ln .n { width: 40px; text-align: right; color: var(--dim3); flex-shrink: 0; }
  .code .ln .m { width: 10px; flex-shrink: 0; font-weight: 700; }
  .code .ln .t { overflow-x: auto; }
  .code .cnote { display: flex; gap: 8px; padding: 4px 8px 6px 56px; font-family: var(--sans); font-size: 12.5px; color: var(--ink2); white-space: normal; }
  .code .cnote b { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; flex-shrink: 0; margin-top: 2px; }
  .code .orphan { padding: 6px 8px; font-family: var(--sans); font-size: 12.5px; color: var(--ink3); border-left: 2px solid var(--edge); margin-top: 8px; }
  .code .orphan b { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; }
  .code .orphan em { color: var(--dim2); font-style: normal; }
  .jump { display: flex; gap: 5px; flex-wrap: wrap; margin: 8px 0; }
  .jump i { font-family: var(--mono); font-style: normal; font-size: 10px; padding: 2px 7px; border-radius: 9px; cursor: pointer;
            border: 1px solid var(--edge); color: var(--dim); background: var(--bg4); }
  .jump i.on { color: var(--bg); background: var(--cyan); border-color: var(--cyan); }

  /* hints */
  .hints { height: 34px; flex-shrink: 0; border-top: 1px solid var(--line); background: var(--bg2);
           display: flex; align-items: center; gap: 18px; padding: 0 18px; overflow: hidden; }
  .hints .g { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .hints .g b { font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; color: var(--pink); }
  .hints .g span, .hints .status { font-family: var(--mono); font-size: 11px; color: var(--dim2); }
  .hints .status { margin-left: auto; color: var(--dim3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hints .status.flash { color: var(--amber); }

  /* notices */
  .notice { background: rgba(223,176,60,0.10); border-bottom: 1px solid rgba(223,176,60,0.3); color: var(--amber); font-size: 12px;
            padding: 6px 18px; display: flex; gap: 12px; align-items: center; }
  .notice .x { margin-left: auto; cursor: pointer; font-family: var(--mono); }

  /* modals — the curses panel(), as a dialog */
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: var(--bg3); border: 1px solid var(--edge); border-radius: 12px; min-width: 420px; max-width: min(760px, 92vw);
           max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .modal.wide { width: min(920px, 94vw); max-width: 94vw; }
  .modal .mh { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .modal .mh b { font-size: 14px; font-weight: 600; }
  .modal .mh em { font-family: var(--mono); font-style: normal; font-size: 11px; color: var(--dim2); margin-left: auto; }
  .modal .mb { padding: 14px 18px; overflow-y: auto; font-size: 13px; line-height: 1.55; color: var(--ink2); }
  .modal .mf { padding: 10px 18px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .modal .mf .sp { flex: 1; }
  .modal .kv { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; }
  .modal .kv span { color: var(--dim); }
  .modal .kv b { font-family: var(--mono); font-weight: 500; color: var(--ink); text-align: right; overflow-wrap: anywhere; }
  .modal .fact { font-size: 14px; line-height: 1.5; color: var(--ink); margin: 10px 0; padding: 10px 12px; background: var(--bg4); border-radius: 8px; }
  .modal .mark { font-family: var(--mono); font-size: 11px; color: var(--green); }
  .modal .mark.warn { color: var(--amber); }
  .modal .mark.err { color: var(--red); }
  .modal textarea, .modal input[type=text] { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--edge); border-radius: 7px;
                    font-family: var(--mono); font-size: 12px; padding: 8px 10px; outline: none; }
  .modal textarea { min-height: 300px; resize: vertical; }
  .modal input[type=text]:focus, .modal textarea:focus { border-color: var(--pink); }
  .modal pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; margin: 0; color: var(--ink2); }
  .modal .opt { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
  .modal .opt:hover { background: var(--bg4); }
  .modal .opt.on { background: var(--bg4); outline: 1px solid var(--edge); }
  .modal .opt .tick { font-family: var(--mono); color: var(--green); width: 14px; }
  .modal .opt kbd { min-width: 20px; }
  .modal .opt em { font-style: normal; color: var(--dim2); font-family: var(--mono); font-size: 11px; margin-left: auto; }
  .modal .diffrow { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; padding: 2px 0; }
  .modal .diffrow.gone { color: var(--red); font-weight: 600; }
  .sky { font-family: var(--mono); color: var(--violet); white-space: pre; line-height: 1.3; opacity: 0.8; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--edge); border-top-color: var(--cyan); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modals"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const api = (p, o) => fetch(p, { ...o, headers: { "X-Dashy-Token": TOKEN, ...(o?.headers || {}) } });
const post = (p, body) => api(p, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (sel) => document.querySelector(sel);
async function err(r) { try { return (await r.json()).error || r.statusText; } catch { return r.statusText || "server gone"; } }

const PALETTE = {
  approved: { fg: "var(--green)", bg: "rgba(79,212,140,0.10)", border: "rgba(79,212,140,0.28)" },
  changes:  { fg: "var(--red)", bg: "rgba(240,101,92,0.10)", border: "rgba(240,101,92,0.28)" },
  commented:{ fg: "var(--amber)", bg: "rgba(223,176,60,0.10)", border: "rgba(223,176,60,0.28)" },
  awaiting: { fg: "var(--cyan)", bg: "rgba(95,196,217,0.10)", border: "rgba(95,196,217,0.28)" },
  running:  { fg: "var(--cyan)", bg: "rgba(95,196,217,0.10)", border: "rgba(95,196,217,0.28)" },
  error:    { fg: "var(--red)", bg: "rgba(240,101,92,0.08)", border: "rgba(240,101,92,0.22)" },
  idle:     { fg: "var(--dim)", bg: "rgba(156,146,168,0.08)", border: "var(--edge)" },
};
const AVATARS = ["#f56bb0", "#5fc4d9", "#4fd48c", "#dfb03c", "#c58cf0", "#f09a5c"];
const SECTION_TONE = { "MINE": "var(--pink)", "REVIEW REQUESTED": "var(--cyan)", "ASSIGNED": "var(--amber)", "REVIEWED": "var(--dim)" };
const SECTION_HINT = { "MINE": "your open PRs", "REVIEW REQUESTED": "waiting on you", "ASSIGNED": "owned by you", "REVIEWED": "recently done" };
const FINDING_TONE = { blocking: "var(--red)", note: "var(--amber)", nit: "var(--cyan)" };
const CHECK_TONE = { ok: "var(--green)", err: "var(--red)", fail: "var(--red)", run: "var(--amber)", skip: "var(--dim)", dim: "var(--dim)" };
const MARK = { blocking: "◆", note: "◇", nit: "·" };
const CONTEXTS = [3, 8, 0];
const SPINNER = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";

function avatar(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 997;
  return AVATARS[h % AVATARS.length];
}
function age(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso)) / 1000;
  for (const [u, d] of [["d", 86400], ["h", 3600], ["m", 60]]) if (s >= d) return Math.floor(s / d) + u;
  return "now";
}
function when(ts) { return new Date(ts * 1000).toLocaleString(undefined, { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }); }
const every = (v) => (v < 60 || v % 60 ? `${v}s` : `${v / 60}m`);
const elapsed = (s) => (s < 60 ? `${s}s` : `${Math.floor(s / 60)}m`);

// ponytail: the status strings are already human — classify by their leading glyph, do not re-derive.
function tone(s) {
  if (!s) return "";
  if (s.startsWith("✓")) return "approved";
  if (s.startsWith("✗")) return "changes";
  if (s.startsWith("~")) return "commented";
  if (s.startsWith("·") || s.startsWith("↻") || s.startsWith("●")) return "awaiting";
  if (/^(error|no )/i.test(s)) return "error";
  return "";
}
/** What the row's chip says: what THIS session did wins over what was fetched, as the curses row did. */
function rowState(p) {
  if (p.busy) {
    const el = p.since ? Math.max(0, Math.floor(Date.now() / 1000 - p.since)) : 0;
    return { key: "running", label: `${(p.review || "reviewing").replace(/\.\.\.$/, "")}… ${elapsed(el)}` };
  }
  for (const s of [p.review, p.status, p.prev]) {
    const t = tone(s);
    if (t) return { key: t, label: s.replace(/^[✓✗~·↻●]\s*/, "") };
  }
  return { key: "idle", label: "no review" };
}

const state = { data: null, detail: null, diff: null, sel: "", query: "", failing: false, folded: {}, expanded: {},
                flash: "", pane: true, tab: "summary", scope: "marks", context: CONTEXTS[0], at: 0, atPr: "", hints: true };
const S = () => state.data?.settings || {};

/** Every PR the filters leave, in list order: the drafts rule, the REVIEWED window, the filter box. */
function visible() {
  const q = state.query.trim().toLowerCase();
  const s = S();
  const cutoff = s.window ? Date.now() - s.window * 3600 * 1000 : 0;
  const out = [];
  for (const sec of state.data?.sections || []) {
    const rows = (sec.prs || []).map((p, i) => ({ ...p, uid: `${sec.name}/${i}/${p.url}`, section: sec.name })).filter((p) => {
      if (!s.drafts && p.isDraft && !p.busy && !p.review) return false;  // a draft under review stays visible
      if (sec.name === "REVIEWED" && cutoff && new Date(p.reviewAt) < cutoff) return false;
      if (state.failing && tone(p.checks) !== "changes") return false;
      if (!q) return true;
      return `${p.title} ${p.repo} ${p.author} #${p.number}`.toLowerCase().includes(q);
    });
    out.push({ ...sec, prs: sec.name === "REVIEWED" ? group(rows) : rows.map((p) => ({ ...p, older: [] })) });
  }
  return out;
}
/** REVIEWED lists one entry per REVIEW; the newest keeps the row and the rest fold under it. */
function group(rows) {
  const by = new Map();
  for (const p of rows) {
    const head = by.get(p.url);
    if (head) head.older.push(p);
    else by.set(p.url, { ...p, older: [] });
  }
  return [...by.values()];
}
const flat = () => visible().filter((s) => !state.folded[s.name])
  .flatMap((s) => s.prs).flatMap((p) => [p, ...(state.expanded[p.url] ? p.older : [])]);
const selected = () => flat().find((p) => p.uid === state.sel) || flat()[0] || null;

/* ---------------------------------------------------------------- render: list */

function rowHTML(p, child) {
  const st = rowState(p);
  const pal = PALETTE[st.key] || PALETTE.idle;
  const ci = tone(p.checks);
  const revs = (p.reviewers || "").split(/\s+/).filter(Boolean).slice(0, 3).map((r) => {
    const pal = PALETTE[tone(r[0])] || PALETTE.idle;
    return `<div class="rev" style="background:${pal.bg};color:${pal.fg}">${esc(r.slice(1))}</div>`;
  }).join("");
  const end = p.busy
    ? `<div class="bar-run"><i style="width:100%"></i></div><span class="mono" style="font-size:11px;color:var(--cyan)">${esc(st.label)}</span>`
    : `${ci ? `<div class="ci" style="background:${PALETTE[ci].fg}" title="checks ${esc(p.checks)}"></div>` : ""}
       <div class="state" style="background:${pal.bg};border:1px solid ${pal.border};color:${pal.fg}">${esc(st.label).slice(0, 24)}</div>`;
  const n = p.older?.length || 0;
  const twist = n
    ? `<div class="twist" data-expand="${esc(p.url)}">${state.expanded[p.url] ? "▾" : "▸"}<em>${n + 1}</em></div>`
    : `<div class="twist"></div>`;
  const subs = S().subs || "all";
  const sub = p.summary && (subs === "all" || (subs === "open" && p.section !== "REVIEWED")) ? `<div class="sub">↳ ${esc(p.summary)}</div>` : "";
  return `<div class="pr${p.uid === state.sel ? " sel" : ""}${child ? " child" : ""}" data-uid="${esc(p.uid)}" data-url="${esc(p.url)}">
    ${child ? `<div class="twist"></div>` : twist}
    <div class="age">${age(p.updatedAt)}</div>
    <div class="repo">${esc((p.repo || "").split("/").pop())}</div>
    <div class="num">#${p.number}</div>
    <div class="txt"><b>${child ? "└ " : ""}${p.isDraft ? `<span style="color:var(--amber)">draft</span> ` : ""}${esc(p.title)}</b>${sub}</div>
    <div class="who"><div class="av" style="background:${avatar(p.author || "?")}">${esc((p.author || "?")[0].toUpperCase())}</div><span>${esc(p.author)}</span></div>
    <div class="revs">${revs}</div>
    <div class="end">${end}</div>
  </div>`;
}

function mineNote(prs) {
  const work = prs.filter((p) => (p.status || "").startsWith("✗")).length;
  const wait = prs.filter((p) => /^[·↻]/.test(p.status || "")).length;
  return [work ? `${work} need work` : "", wait ? `${wait} waiting` : ""].filter(Boolean).join(" · ");
}

function listHTML() {
  const d = state.data;
  if (d && !d.fetchedAt && !d.sections?.length) return `<div class="splash"><div class="logo"><img src="{{LOGO}}" alt="" /></div>
    <div style="color:var(--amber);font-weight:600">${SPINNER[Math.floor(Date.now() / 125) % SPINNER.length]}  fetching pull requests…</div>
    <div class="mono" style="font-size:11px">created by</div><div style="color:var(--cyan);font-weight:600;letter-spacing:.2em">M a r t i n   S o r i a   R ø v a n g</div></div>`;
  let html = "";
  for (const s of visible()) {
    const open = !state.folded[s.name];
    const colour = SECTION_TONE[s.name] || "var(--dim)";
    const hint = s.name === "MINE" ? mineNote(s.prs) || SECTION_HINT[s.name] : SECTION_HINT[s.name] || "";
    html += `<div>
      <div class="head" data-fold="${esc(s.name)}">
        <span class="caret">${open ? "▾" : "▸"}</span>
        <span class="label" style="color:${colour}">${esc(s.name)}</span>
        <span class="count">${s.prs.length}</span>
        <div class="fill"></div>
        <span class="hint">${esc(hint)}</span>
      </div>`;
    if (open) {
      if (s.error) html += `<div class="none err">${esc(s.error.split("\n")[0])}</div>`;
      else if (!s.prs.length) html += `<div class="none">${s.name === "REVIEWED" && S().window ? `none in the last ${S().window}h` : "none"}</div>`;
      else {
        // ponytail: grouped by team only when more than one label is present; a separator above a single
        // group restates what the whole list already is. Unbound sorts last.
        const labels = new Set(s.prs.map((p) => p.team || ""));
        const prs = labels.size > 1 ? [...s.prs].sort((a, b) => ((a.team || "") === "") - ((b.team || "") === "") || (a.team || "").localeCompare(b.team || "")) : s.prs;
        let seen = null;
        for (const p of prs) {
          if (labels.size > 1 && (p.team || "") !== seen) { seen = p.team || ""; html += `<div class="group">─ ${esc(seen || "not bound to a team")} <i></i></div>`; }
          html += rowHTML(p) + (state.expanded[p.url] ? p.older.map((o) => rowHTML(o, true)).join("") : "");
        }
      }
    }
    html += `</div>`;
  }
  return html || `<div class="none">nothing fetched yet</div>`;
}

/* ---------------------------------------------------------------- render: pane */

function actsHTML(p, d) {
  const acts = [];
  const rr = p.section === "REVIEW REQUESTED", mine = p.section === "MINE";
  const reviewed = !!(p.review && !p.busy && tone(p.review));
  if (rr) acts.push(["r", "go", p.busy ? "Reviewing…" : reviewed ? "Reviewed" : "Review this PR", state.data?.model || "", p.busy || reviewed, "review"]);
  if (mine) acts.push(["p", "", p.pre?.moved ? "Re-run the pre-review" : p.pre ? "Read the pre-review" : "Pre-review", p.pre?.moved ? "the PR moved since" : "nothing posted", p.busy, "pre"]);
  if (mine && p.pre) acts.push(["Y", "", "Open the pre-review", "desktop .md handler", false, "openpre"]);
  if (d?.review) acts.push(["v", "", "Read the full review", d.review.model, false, "view"]);
  acts.push(["o", "", "Open in browser", "github", false, "open"]);
  acts.push(["y", "", "Copy the URL", "clipboard", false, "copy"]);
  if (mine) acts.push(["+", "", "Request a review", "pick a collaborator", false, "reviewer"]);
  acts.push(["b", "", "Bind the repo to a team", d?.brief?.whose || "", false, "bind"]);
  acts.push(["n", "", "Edit this repo's memory", (p.repo || "").split("/").pop(), false, "memory"]);
  return acts.map(([k, cls, label, note, off, act]) =>
    `<div class="act ${cls}${off ? " off" : ""}" data-act="${act}"><kbd class="hint">${esc(k)}</kbd><b>${esc(label)}</b><em>${esc(note)}</em></div>`).join("");
}

function codeHTML(p) {
  const c = state.diff && state.diff.url === p.url ? state.diff : null;
  if (!c || c.pending) return `<div class="prose"><span class="spinner"></span> reading the diff…</div>`;
  if (c.empty) return `<div class="prose">${esc(c.empty)}</div>`;
  const scoped = state.scope === "marks";
  const rows = c.rows;
  const jump = rows.map((r, i) => [r, i]).filter(([r]) => scoped ? (r.kind === "note" || r.kind === "orphan") : r.kind === "file").map(([, i]) => i);
  if (state.atPr !== p.url) { state.atPr = p.url; state.at = 0; }
  state.at = jump.length ? Math.max(0, Math.min(state.at, jump.length - 1)) : 0;
  const chips = jump.map((i, k) => {
    const r = rows[i];
    const t = scoped ? `${k + 1}${MARK[r.mark] || "·"} ${(r.loc || nearestFile(rows, i)).split("/").pop()}` : `${r.path.split("/").pop()} +${r.add}−${r.dele}`;
    return `<i class="${k === state.at ? "on" : ""}" data-jump="${k}">${esc(t)}</i>`;
  }).join("");
  const body = rows.map((r, i) => {
    const id = jump[state.at] === i ? ' id="jumpto"' : "";
    if (r.kind === "file") return `<div class="file"${id}>${esc(r.path)}<em>+${r.add} −${r.dele}</em></div>`;
    if (r.kind === "hunk") return `<div class="hunk">${esc(r.header)}</div>`;
    if (r.kind === "line") return `<div class="ln ${r.mark ? "marked" : r.sign === "+" ? "add" : r.sign === "-" ? "del" : ""}">
        <span class="m" style="color:${FINDING_TONE[r.mark] || "transparent"}">${r.mark ? MARK[r.mark] : " "}</span>
        <span class="n">${r.del ? "" : r.n}</span><span>${esc(r.sign)}</span><span class="t">${esc(r.text.replace(/\t/g, "    "))}</span></div>`;
    if (r.kind === "note") return `<div class="cnote"${id}><b style="color:${FINDING_TONE[r.mark] || "var(--dim)"}">${esc(r.mark.toUpperCase())}</b><span>${esc(r.text)}</span></div>`;
    if (r.kind === "orphan") return `<div class="orphan"${id}><b style="color:${FINDING_TONE[r.mark] || "var(--dim)"}">${esc(r.mark.toUpperCase())}</b> ${esc(r.text)} <em>· ${esc(r.loc)} ${esc(r.why)}</em></div>`;
    return `<div style="height:8px"></div>`;
  }).join("");
  return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="lab">SCOPE</span>
      <span class="tab${scoped ? " on" : ""}" data-scope="marks">marks only</span>
      <span class="tab${scoped ? "" : " on"}" data-scope="diff">full diff</span>
      ${scoped ? `<span class="tab" data-context="1">context ±${state.context}</span>` : ""}
      <span class="mono" style="font-size:10px;color:var(--dim3);margin-left:auto">${state.hints ? "D toggle · c context · n/N " + (scoped ? "mark" : "file") : ""}</span>
    </div>
    ${chips ? `<div class="jump">${chips}</div>` : ""}
    <div class="code">${body}</div>`;
}
function nearestFile(rows, i) { for (let k = i; k >= 0; k--) if (rows[k].kind === "file") return rows[k].path; return ""; }

function paneHTML(p) {
  if (!p) return `<div class="bar"></div><div class="in"><div class="prose">No PR selected.</div></div>`;
  const st = rowState(p);
  const pal = PALETTE[st.key] || PALETTE.idle;
  const d = state.detail && state.detail.url === p.url ? state.detail : null;  // one PR behind is worse than blank
  const rev = d && d.review;
  const code = state.tab === "code";
  const size = d && d.add != null ? `<span class="mono" style="color:var(--green)">+${d.add}</span>
      <span class="mono" style="color:var(--red)">−${d.del}</span>
      <span class="mono" style="color:var(--dim2)">${d.files} files</span>` : "";
  const checks = (d?.checks || []).map((c) => `<div class="check">
      <div class="ci" style="background:${CHECK_TONE[c.state] || CHECK_TONE.dim}"></div>
      <span>${esc(c.name)}</span><em>${esc(c.state)}</em></div>`).join("");
  const found = rev?.findings || [];
  const counts = ["blocking", "note", "nit"].filter((k) => found.some((f) => f.kind === k))
    .map((k) => `<span class="mono" style="font-size:11px;color:${FINDING_TONE[k]}">${found.filter((f) => f.kind === k).length} ${k}</span>`).join(" ");
  const findings = found.map((f) => `<div class="find">
      <i style="background:${FINDING_TONE[f.kind] || CHECK_TONE.dim}"></i>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="tag" style="color:${FINDING_TONE[f.kind] || CHECK_TONE.dim}">${esc(f.kind.toUpperCase())}</span>
          <span class="loc">${esc((f.loc || "").split("/").pop())}</span>
        </div>
        <p>${esc(f.text)}</p>
      </div></div>`).join("");
  const pre = d?.pre || p.pre;
  return `
  <div class="bar">
    <span class="lab">SELECTED PR</span>
    <span class="tab${code ? "" : " on"}" data-tab="summary"><kbd class="hint">1</kbd>summary</span>
    <span class="tab${code ? " on" : ""}" data-tab="code"><kbd class="hint">2</kbd>code</span>
    <div style="flex:1"></div>
    <div class="mono" style="font-size:11px;color:var(--dim2)">${d && d.branch ? esc(d.branch) : d && d.pending ? "loading…" : ""}</div>
    <span class="ib" data-pane="1" title="hide the pane (⏎)">×</span>
  </div>
  <div class="in scroll">
    <div class="crumbs">
      <span style="color:var(--pink)">#${p.number}</span>
      <span>${esc(p.repo)}</span><span style="color:var(--dim3)">·</span>
      <span>updated ${age(p.updatedAt)} ago</span>
    </div>
    <div class="ptitle">${esc(p.title)}</div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px">
      <div class="av" style="width:24px;height:24px;font-size:11px;background:${avatar(p.author || "?")}">${esc((p.author || "?")[0].toUpperCase())}</div>
      <span style="font-size:13px;color:var(--ink2)">${esc(p.author)}</span>
      <div style="flex:1"></div>
      <div class="state" style="height:24px;background:${pal.bg};border:1px solid ${pal.border};color:${pal.fg}">${esc(st.label)}</div>
    </div>
    ${size ? `<div style="display:flex;gap:10px;margin-top:10px;font-size:11px">${size}</div>` : ""}
    <div style="display:flex;gap:8px;margin-top:10px;align-items:center"><span class="lab">BRIEF</span>
      <span class="mono" style="font-size:11px;color:var(--dim)">${d ? esc(d.brief.whose) + (d.brief.empty ? " · none" : "") : "…"}</span></div>
    ${code ? `<div class="sep"></div>${codeHTML(p)}` : `
    ${checks ? `<div class="sep"></div><div class="lab">CHECKS</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${checks}</div>` : ""}
    ${rev ? `<div class="sep"></div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="lab">AI REVIEW</span>
        <span class="mono" style="font-size:11px;color:var(--dim2)">${esc(rev.model)} ${esc(rev.tag)}</span>
        <span class="mono" style="font-size:11px;color:var(--dim3);margin-left:auto">${age(rev.at)} ago</span>
      </div>
      <div style="margin-top:8px;display:flex;gap:10px;align-items:center">

/* ---------------------------------------------------------------- modals */

const modals = [];  // the stack; the top one owns the keyboard
function openModal(m) {
  m.el = document.createElement("div");
  m.el.className = "veil";
  modals.push(m);
  document.getElementById("modals").appendChild(m.el);
  paint(m);
  return m;
}
function paint(m) {
  if (!m.el) return;
  const foot = (m.foot || []).map(([k, label, fn, cls]) => `<span class="btn ${cls || ""}" data-mkey="${esc(k)}"><kbd>${esc(k)}</kbd>${esc(label)}</span>`).join("");
  m.el.innerHTML = `<div class="modal${m.wide ? " wide" : ""}"><div class="mh"><b>${esc(m.title)}</b>${m.sub ? `<em>${esc(m.sub)}</em>` : ""}</div>
    <div class="mb scroll">${m.body()}</div>${foot ? `<div class="mf">${foot}</div>` : ""}</div>`;
  if (m.focus) m.el.querySelector(m.focus)?.focus();
}
function closeModal(m) {
  const i = modals.indexOf(m);
  if (i >= 0) modals.splice(i, 1);
  m.el?.remove();
  m.onClose?.();
}
document.getElementById("modals").addEventListener("click", (e) => {
  const m = modals[modals.length - 1];
  if (!m) return;
  const b = e.target.closest("[data-mkey]");
  if (b) return modalKey(m, b.dataset.mkey);
  const opt = e.target.closest("[data-opt]");
  if (opt && m.pickOpt) return m.pickOpt(+opt.dataset.opt);
  if (e.target === m.el && m.dismiss !== false) closeModal(m);
});
function modalKey(m, k) {
  const f = (m.foot || []).find(([key]) => key === k);
  if (f) return f[2]();
  if (m.keys?.[k]) return m.keys[k]();
}

/** One yes/no. Resolves true only on y / Enter / the yes button. */
function confirm(text, { yes = "yes", no = "no", title = "gitdashy" } = {}) {
  return new Promise((res) => {
    const m = openModal({ title, body: () => `<div>${esc(text)}</div>`, dismiss: false,
      foot: [["y", yes, () => { closeModal(m); res(true); }, "go"], ["n", no, () => { closeModal(m); res(false); }]] });
    m.keys = { Enter: () => { closeModal(m); res(true); }, Escape: () => { closeModal(m); res(false); } };
  });
}
/** Any key closes. */
function notice(text, title = "gitdashy") {
  return new Promise((res) => {
    const m = openModal({ title, body: () => `<div>${esc(text)}</div>`, foot: [["Enter", "ok", () => { closeModal(m); res(); }]] });
    m.keys = { Escape: () => { closeModal(m); res(); } };
  });
}
/** A line of text. Resolves "" on cancel. */
function prompt(text, value = "", title = "gitdashy") {
  return new Promise((res) => {
    const m = openModal({ title, body: () => `<div style="margin-bottom:10px">${esc(text)}</div><input type="text" id="mi" value="${esc(value)}" />`,
      focus: "#mi", dismiss: false,
      foot: [["Enter", "ok", () => { const v = m.el.querySelector("#mi").value.trim(); closeModal(m); res(v); }, "go"],
             ["Esc", "cancel", () => { closeModal(m); res(""); }]] });
    m.keys = { Enter: () => m.foot[0][2](), Escape: () => m.foot[1][2]() };
  });
}
/** Read-only text, like less. */
function viewer(title, text, sub = "") {
  const m = openModal({ title, sub, wide: true, body: () => `<pre>${esc(text)}</pre>`, foot: [["q", "close", () => closeModal(m)]] });
  m.keys = { Escape: () => closeModal(m) };
}
/** A textarea and a save. */
function editor(title, text, onSave, sub = "") {
  const m = openModal({ title, sub, wide: true, body: () => `<textarea id="me">${esc(text)}</textarea>`, focus: "#me", dismiss: false,
    foot: [["^S", "save", async () => { await onSave(m.el.querySelector("#me").value); closeModal(m); }, "go"], ["Esc", "discard", () => closeModal(m)]] });
  m.keys = { Escape: () => closeModal(m), "ctrl+s": () => m.foot[0][2]() };
}
/** A list to pick from with j/k/Enter, the curses dropdown. `many` toggles rows and stays open. */
function picker(title, options, current, show, onPick, many = false) {
  let idx = many ? 0 : Math.max(0, options.indexOf(current));
  const m = openModal({ title, dismiss: true, body: () => options.map((o, i) => `<div class="opt${i === idx ? " on" : ""}" data-opt="${i}">
      <span class="tick">${many ? (current.includes(o) ? "✓" : "") : o === current ? "✓" : ""}</span><span>${esc(show(o))}</span></div>`).join(""),
    foot: [["⏎", many ? "toggle" : "pick", () => m.pickOpt(idx), "go"], ["Esc", many ? "close" : "keep", () => closeModal(m)]] });
  m.pickOpt = (i) => {
    idx = i;
    if (!many) { closeModal(m); return onPick(options[i]); }
    current = current.includes(options[i]) ? current.filter((v) => v !== options[i]) : options.filter((v) => current.includes(v) || v === options[i]);
    onPick(current); paint(m);
  };
  m.keys = { j: () => { idx = (idx + 1) % options.length; paint(m); }, k: () => { idx = (idx - 1 + options.length) % options.length; paint(m); },
             Enter: () => m.pickOpt(idx), Escape: () => closeModal(m) };
}

/* ---------------------------------------------------------------- actions */

let flashTimer;
function flash(msg) {
  state.flash = msg;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { state.flash = ""; render(); }, 4000);
  render();
}
async function call(path, body, okMsg) {
  const r = await post(path, body);
  if (!r.ok) { flash(`✗ ${await err(r)}`); return null; }
  const out = await r.json();
  if (okMsg) flash(okMsg);
  tick();
  return out;
}

async function review(p) {
  if (!p || p.busy || p.section !== "REVIEW REQUESTED") return;
  if (tone(p.review)) return flash(`#${p.number} is already reviewed`);
  if (!await confirm(`Claude review + post verdict on #${p.number}?`)) return;
  await call("/api/review", { url: p.url }, `review started on #${p.number}`);
}
async function preReview(p) {
  if (!p || p.busy || p.section !== "MINE") return;
  if (p.pre && !p.pre.moved) {
    const r = await api(`/api/prereview?url=${encodeURIComponent(p.url)}`);
    if (!r.ok) return flash(`✗ ${await err(r)}`);
    const got = await r.json();
    return viewer(`pre-review of #${p.number}`, got.text, got.path);
  }
  if (!await confirm(p.pre ? `#${p.number} changed since its pre-review. Run again?` : `Pre-review #${p.number}? Nothing is posted.`)) return;
  await call("/api/review", { url: p.url, self: true }, `pre-review started on #${p.number}`);
}
async function viewReview(p) {
  const d = state.detail && state.detail.url === p?.url ? state.detail : null;
  if (!d?.review) return flash("no review of this PR yet");
  viewer(`review of #${p.number}`, d.review.text, `${d.review.model} ${d.review.tag}`);
}
async function setting(name, value) {
  document.activeElement?.blur();
  const shown = Array.isArray(value) ? value.join(", ") || "off" : name === "interval" ? every(+value) : name === "window" ? (value == null ? "all" : value + "h") : String(value === "" ? "default" : value);
  await call("/api/settings", { [name]: value }, `${name} is now ${shown}`);
}
async function toggleAuto() {
  const on = !state.data?.auto;
  let includeExisting = false;
  if (on && state.data?.pending) includeExisting = await confirm(`Auto on. Also review the ${state.data.pending} already listed?`, { yes: "yes, all of them", no: "only new ones" });
  await call("/api/auto", { on, includeExisting }, on ? "auto on" : "auto off");
}
function move(step) {
  const list = flat();
  const i = list.findIndex((p) => p.uid === state.sel);
  const next = list[Math.min(list.length - 1, Math.max(0, i + step))];
  if (next) { select(next.uid); }
}
function select(uid) { state.sel = uid; state.detail = null; state.diff = null; render(); pull(); $(".pr.sel")?.scrollIntoView({ block: "nearest" }); }
function pickSetting(key) {
  const s = S(), o = state.data?.options || {};
  const table = {
    m: ["Model", "model", o.model, s.model, String], d: ["Depth", "depth", o.depth, s.depth, String],
    e: ["Effort", "effort", o.effort, s.effort, (v) => v || "default"], s: ["Summaries", "subs", o.subs, s.subs, String],
    t: ["History", "window", o.window, s.window, (v) => v == null ? "all" : `${v}h`], i: ["Refresh", "interval", o.interval, s.interval, every],
    x: ["Voices", "voice", o.voice, s.voice, String, true], h: ["Hunters", "hunter", o.hunter, s.hunter, String, true],
  };
  const [title, name, options, cur, show, many] = table[key];
  const all = many || options.includes(cur) ? options : [cur, ...options];
  picker(title, all, cur, show, (v) => setting(name, v), many);
}

/* --- the screens the curses keys opened --- */

async function memoryEditor(repo) {
  const r = await api(`/api/memory?repo=${encodeURIComponent(repo || "")}`);
  if (!r.ok) return flash(`✗ ${await err(r)}`);
  const got = await r.json();
  editor(`memory · ${got.repo}`, got.text, async (text) => {
    const out = await call("/api/memory", { repo: got.repo, text }, `${got.repo} memory saved`);
    if (out?.error) flash(`saved, but not pushed: ${out.error}`);
  }, got.path);
}

async function draftsScreen() {
  let items = [], i = 0, promoteAt = 2;
  const load = async () => { const r = await api("/api/drafts"); const got = await r.json(); items = got.items; promoteAt = got.promoteAt; i = items.length ? i % items.length : 0; };
  await load();
  if (!items.length) return notice("nothing waiting — every observation so far is either a fact or gone");
  const m = openModal({ title: "waiting", body: () => {
      if (!items.length) return `<div>nothing waiting any more</div>`;
      const it = items[i];
      const left = promoteAt - it.n;
      const mark = it.kind === "self" ? "pre-review · one opinion" : `seen ${it.n}×` + (left > 0 ? ` · ${left} more to go` : " · confirmed");
      return `<div class="kv"><span>${esc(it.repo || "general")}${it.team ? ` · team ${esc(it.team)}` : ""}</span><b class="mark warn">${esc(mark)}</b></div><div class="fact">${esc(it.fact)}</div>`;
    },
    foot: [["t", "make it a fact", async () => { const it = items[i]; if (!it) return; await call("/api/drafts", { op: "promote", repo: it.repo, fact: it.fact }, "accepted"); await load(); paint(m); }, "go"],
           ["x", "drop", async () => { const it = items[i]; if (!it) return; await call("/api/drafts", { op: "drop", repo: it.repo, fact: it.fact }, "dropped"); await load(); paint(m); }, "warn"],
           ["s", "scan for repeats", () => overlapScreen(async () => { i = 0; await load(); paint(m); })],
           ["j/k", "move", () => {}], ["Esc", "close", () => closeModal(m)]] });
  const refresh = () => { m.sub = `${items.length ? i + 1 : 0}/${items.length}`; paint(m); };
  m.keys = { j: () => { if (items.length) { i = (i + 1) % items.length; refresh(); } }, k: () => { if (items.length) { i = (i - 1 + items.length) % items.length; refresh(); } },
             Escape: () => closeModal(m), q: () => closeModal(m) };
  refresh();
}

async function overlapScreen(onDone) {
  await post("/api/overlaps", { op: "start" });
  const model = state.data?.model || "the model";
  let pairs = null, i = 0;
  const m = openModal({ title: "same fact?", dismiss: false, body: () => {
      if (pairs === null) return `<div><span class="spinner"></span> ${esc(model)} is reading the candidates…</div>`;
      if (!pairs.length) return `<div>no two drafts look like one fact — nothing to fold</div>`;
      const p = pairs[i];
      return `<div class="kv"><span>${esc(p.repo || "general")}</span><b class="mark ${p.promotes ? "" : "warn"}">${esc(p.says)} · folds to ${p.would}×${p.promotes ? " · becomes a fact" : ""}</b></div>
        <div class="lab" style="margin-top:8px">A</div><div class="fact">${esc(p.a)}</div><div class="lab">B</div><div class="fact">${esc(p.b)}</div>`;
    },
    foot: [] });
  const done = () => { closeModal(m); onDone?.(); };
  const fold = async (keepA) => { const p = pairs[i]; await call("/api/overlaps", { op: "merge", repo: p.repo, keep: keepA ? p.a : p.b, drop: keepA ? p.b : p.a }, "folded"); next(); };
  const next = () => { i += 1; if (i >= pairs.length) done(); else paint(m); };
  m.keys = { Escape: done, q: done };
  const poll = async () => {
    if (!modals.includes(m)) return;
    const r = await api("/api/overlaps");
    const j = await r.json();
    if (j.running) { paint(m); return setTimeout(poll, 1000); }
    if (j.error) { closeModal(m); return notice(`scan failed: ${j.error}`); }
    pairs = j.result || [];
    m.sub = pairs.length ? `1/${pairs.length}` : "";
    if (pairs.length) { m.foot = [["y", "one fact, keep A", () => fold(true), "go"], ["b", "keep B", () => fold(false)], ["n", "different", next], ["Esc", "stop", done]]; m.keys.y = () => fold(true); m.keys.b = () => fold(false); m.keys.n = next; }
    else m.foot = [["Esc", "close", done]];

  };

}

function teamScreen(key, p) {
  return new Promise(async (res) => {
    const load = async () => ((await api("/api/teams")).json()).then((g) => g.teams.find((t) => t.key === key));
    let t = await load();
    if (!t) return res();
    // ponytail: claims the team added since you last answered are asked as you open it — a sentence with two answers
    for (const target of t.undecided || []) {
      const yes = await confirm(`${t.name.slice(0, 24)} now covers ${target} — use it here too?`);
      await call("/api/teams", { op: "claim", key, target, yes });
    }
    t = await load();
    const m = openModal({ title: `${t.name}  (${key})`, body: () => `
        <div class="kv"><span>what it is for</span><b>${esc(t.description || "nothing yet")}</b></div>
        <div class="kv"><span>checkout</span><b>${esc(t.checkout)}</b></div>
        <div class="kv"><span>git remote</span><b>${esc(t.remote || "none yet")}</b></div>
        <div class="kv"><span>used for</span><b>${esc(t.used || "nothing yet")}</b></div>`, foot: [] });
    const done = () => { closeModal(m); res(); };
    const reload = async () => { t = await load(); if (!t) return done(); paint(m); };
    const verbs = {
      e: async () => { const r = await api(`/api/teams?brief=${encodeURIComponent(key)}`); const got = await r.json();
        editor(`brief · ${key}`, got.text, async (text) => { const out = await call("/api/teams", { op: "brief", key, text }, "brief saved"); if (out?.error) flash(`saved, but not pushed: ${out.error}`); }, got.path); },
      d: async () => { const desc = await prompt(`One line: what is ${t.name} for?  [now: ${t.description.slice(0, 40) || "nothing yet"}]`); if (desc) { await call("/api/teams", { op: "describe", key, desc }, "described"); await reload(); } },
      c: async () => { const url = await prompt(`Git URL for ${key} (an EMPTY repo you can push to — one with history is a team to join):`); if (url) { const out = await call("/api/teams", { op: "connect", key, url }); if (out) await notice(`${key} now pushes to ${out.remote}`); await reload(); } },
      o: async () => { const dflt = p ? p.repo.split("/")[0] : ""; const said = await prompt("Cover which owner?" + (dflt ? ` [${dflt}]` : " (e.g. neomedsys):"), dflt);
        const owner = said || dflt; if (!owner) return;
        if (!await confirm(`${t.name.slice(0, 24)} covers ${owner}/*, for everyone who joins?`)) return;
        await call("/api/teams", { op: "cover", key, owner }, `covers ${owner}/*`); await reload(); },
      x: async () => { const what = t.linked ? "removes only the link, your checkout is kept" : "DELETES its files";
        if (!await confirm(`leave ${key}? it ${what} — ${t.checkout}`, { yes: "leave", no: "stay" })) return;
        if (await call("/api/teams", { op: "leave", key }, `left ${key}`)) done(); },
    };
    m.foot = [["e", "brief", verbs.e], ["d", "describe", verbs.d], ["c", "remote", verbs.c], ["o", "cover", verbs.o], ["x", "leave", verbs.x, "warn"], ["Esc", "back", done]];
    m.keys = { ...verbs, Escape: done, q: done };
    paint(m);
  });
}

async function dreamScreen() {
  if (!await confirm("Dream: Claude tidies every memory file (merge, dedupe, drop stale). Nothing is written until you accept. Start?")) return;
  await post("/api/dream", { op: "start" });
  const model = state.data?.model || "the model";
  const SKY = "˖ ⋆ ✧ ✦ ☾ · ° ˚ z Z".split(" ");
  let seed = 1;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const sky = () => Array.from({ length: 4 }, () => Array.from({ length: 44 }, () => (rnd() < 0.18 ? SKY[Math.floor(rnd() * SKY.length)] : " ")).join("")).join("\n");
  let res = null, elapsedS = 0;
  const m = openModal({ title: "dreaming", dismiss: false, body: () => res
      ? `<pre>${esc(res.summary)}</pre><div class="sep"></div>${res.files.map((f) => `<div class="diffrow${f.deleted ? " gone" : ""}"><span>${esc(f.name)}</span><span>${f.before} → ${f.deleted ? "DELETED" : f.after}</span></div>`).join("")}`
      : `<div class="sky">${esc(sky())}</div><div style="margin-top:10px"><span class="spinner"></span> ${esc(model)} is tidying the memories… <span class="mono" style="color:var(--dim2)">${elapsedS}s</span></div>`,
    foot: [["Esc", "wake up without changes", () => { closeModal(m); post("/api/dream", { op: "discard" }); }]] });
  const stop = () => { closeModal(m); post("/api/dream", { op: "discard" }); };
  m.keys = { Escape: stop };
  const poll = async () => {
    if (!modals.includes(m)) return;
    const j = await (await api("/api/dream")).json();
    if (j.running) { elapsedS = j.elapsed; paint(m); return setTimeout(poll, 500); }
    if (j.error) { closeModal(m); return notice(`dream failed: ${j.error}`); }
    res = j.result;
    const gone = res.files.filter((f) => f.deleted);
    m.title = "dream over";
    const accept = async () => {
      if (gone.length && !await confirm(`DELETE ${gone.map((f) => f.name).join(", ")} — ${res.lost} fact${res.lost === 1 ? "" : "s"} lost. Sure?`, { yes: "delete", no: "keep" })) return;
      const out = await call("/api/dream", { op: "apply" }, "memory rewritten");
      if (out?.error) await notice(out.error);
      closeModal(m);
    };
    m.foot = [["y", gone.length ? `accept — DELETES ${gone.length} file${gone.length === 1 ? "" : "s"}` : "accept and rewrite memory", accept, gone.length ? "warn" : "go"],
              ["v", "view full", () => viewer("the dream", res.detail)], ["n", "discard", stop]];
    m.keys = { y: accept, v: m.foot[1][2], n: stop, Escape: stop };
    paint(m);
  };
  poll();
}

async function setPath(which) {
  const k = state.data?.knowledge || {};
  const cur = which === "L" ? k.memory : k.store;
  const what = which === "L" ? "Memory" : "Store";
  const path = await prompt(`${what} directory${which === "L" ? ", or a git repo to clone" : ""} [${cur}]:`);
  if (!path) return;
  let r = await post("/api/path", { which, path });
  let out = r.ok ? await r.json() : null;
  if (!r.ok) return flash(`✗ ${await err(r)}`);
  if (out.confirm) {
    if (!await confirm(out.confirm)) return;
    r = await post("/api/path", { which, path, force: true });
    if (!r.ok) return flash(`✗ ${await err(r)}`);
  }
  flash(`${what} is now ${path}`);
  tick();
}

document.addEventListener("click", async (e) => {
  if (e.target.closest("#modals")) return;
  const t = (sel) => e.target.closest(sel);
  const p = selected();
  let x;
  if ((x = t("[data-expand]"))) { state.expanded[x.dataset.expand] = !state.expanded[x.dataset.expand]; return render(); }
  if (t("[data-auto]")) return toggleAuto();
  if (t("[data-refresh]")) return call("/api/refresh", {}, "refreshing…");
  if (t("[data-menu]")) return escMenu();
  if (t("[data-update]")) return updateScreen();
  if (t("[data-dismiss]")) return call("/api/notices", {});
  if (t("[data-pane]")) { state.pane = !state.pane; return render(); }
  if ((x = t("[data-tab]"))) { state.tab = x.dataset.tab; render(); return pullDiff(); }
  if ((x = t("[data-scope]"))) { state.scope = x.dataset.scope; state.diff = null; render(); return pullDiff(); }
  if (t("[data-context]")) { state.context = CONTEXTS[(CONTEXTS.indexOf(state.context) + 1) % CONTEXTS.length]; state.diff = null; render(); return pullDiff(); }
  if ((x = t("[data-jump]"))) { state.at = +x.dataset.jump; render(); return scrollJump(); }
  if ((x = t("[data-act]"))) return act(x.dataset.act, p);
  if ((x = t("[data-filter]"))) { state[x.dataset.filter] = !state[x.dataset.filter]; return render(); }
  if (t("[data-toggle='drafts']")) return setting("drafts", !S().drafts);
  if ((x = t("[data-chip]"))) { const cur = S()[x.dataset.chip] || []; const v = x.dataset.val;
    return setting(x.dataset.chip, cur.includes(v) ? cur.filter((c) => c !== v) : [...cur, v]); }
  if ((x = t("[data-path]"))) return setPath(x.dataset.path);
  if (t("[data-teams]")) return teamsScreen(p);
  if ((x = t("[data-modal]"))) return ({ drafts: draftsScreen, share: () => shareScreen(p), dream: dreamScreen, general: () => memoryEditor("") })[x.dataset.modal]();
  if ((x = t("[data-jumpsec]"))) { [...document.querySelectorAll("[data-fold]")].find((h) => h.dataset.fold === x.dataset.jumpsec)?.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
  if ((x = t("[data-fold]"))) { state.folded[x.dataset.fold] = !state.folded[x.dataset.fold]; return render(); }
  if ((x = t("[data-uid]"))) return select(x.dataset.uid);
});

function act(name, p) {
  const fns = { review: () => review(p), pre: () => preReview(p), openpre: () => call("/api/open", { url: p.url, pre: true }, "handed the pre-review to the desktop"),
    view: () => viewReview(p), open: () => call("/api/open", { url: p.url }), copy: () => copyUrl(p), reviewer: () => addReviewer(p), bind: () => bindScreen(p),
    memory: () => memoryEditor(p.repo) };
  if (p && fns[name]) fns[name]();
}
async function copyUrl(p) {
  if (!p) return;
  const out = await call("/api/copy", { url: p.url });
  if (out) flash(out.tool === "terminal" ? `sent ${p.url} to the terminal — if nothing landed, install wl-clipboard or xclip` : `✓ copied ${p.url} (via ${out.tool})`);
}
function scrollJump() { document.getElementById("jumpto")?.scrollIntoView({ block: "center" }); }

document.addEventListener("keydown", (e) => {
  const top = modals[modals.length - 1];
  const key = e.ctrlKey && e.key === "s" ? "ctrl+s" : e.key;
  if (top) {
    if (/input|textarea/i.test(e.target.tagName) && !["Escape", "Enter", "ctrl+s"].includes(key)) return;
    if (/textarea/i.test(e.target.tagName) && key === "Enter") return;
    if (top.keys?.[key] || (top.foot || []).some(([k]) => k === key)) { e.preventDefault(); modalKey(top, key); }
    return;
  }
  if (/input|textarea|select/i.test(e.target.tagName)) {
    if (e.key === "Escape") { if (e.target.id === "q") state.query = ""; e.target.blur(); render(); }
    return;
  }
  const p = selected();
  const k = e.key;
  const code = state.pane && state.tab === "code" && p && (state.detail?.url === p.url && state.detail?.review);
  const one = (fn) => { e.preventDefault(); fn(); };
  if (k === "j" || k === "ArrowDown") return one(() => move(1));
  if (k === "k" || k === "ArrowUp") return one(() => move(-1));
  // ponytail: the code tab's keys sit ABOVE the global D and n — both are bound twice, and the first branch wins.
  if (code && ["D", "n", "N", "c"].includes(k)) return one(() => {
    if (k === "D") { state.scope = state.scope === "marks" ? "diff" : "marks"; state.diff = null; render(); pullDiff(); }
    else if (k === "c") { state.context = CONTEXTS[(CONTEXTS.indexOf(state.context) + 1) % CONTEXTS.length]; state.diff = null; render(); pullDiff(); }
    else { state.at += k === "n" ? 1 : -1; render(); scrollJump(); }
  });
  if (k === "f") return one(() => call("/api/refresh", {}, "refreshing…"));
  if (k === "a") return one(toggleAuto);
  if (k === "D") return one(() => setting("drafts", !S().drafts));
  if (k === "?") return one(() => { state.hints = !state.hints; render(); });
  if (k === " " && p?.section === "REVIEWED") return one(() => { state.expanded[p.url] = !state.expanded[p.url]; render(); });
  if ("mdexhsti".includes(k) && k) return one(() => pickSetting(k));
  if (k === "o" && p) return one(() => call("/api/open", { url: p.url }));
  if (k === "+" && p) return one(() => addReviewer(p));
  if (k === "p" && p) return one(() => preReview(p));
  if (k === "Y" && p) return one(() => call("/api/open", { url: p.url, pre: true }, "handed the pre-review to the desktop"));
  if (k === "y" && p) return one(() => copyUrl(p));
  if (k === "g") return one(() => memoryEditor(""));
  if (k === "n" && p) return one(() => memoryEditor(p.repo));
  if (k === "Z") return one(dreamScreen);
  if (k === "P") return one(() => shareScreen(p));
  if (k === "W") return one(draftsScreen);
  if (k === "b") return one(() => bindScreen(p));
  if (k === "1" || k === "2") return one(() => { state.tab = k === "1" ? "summary" : "code"; render(); pullDiff(); });
  if (k === "Tab") return one(() => { state.tab = state.tab === "summary" ? "code" : "summary"; render(); pullDiff(); });
  if (k === "T") return one(() => teamsScreen(p));
  if (k === "L" || k === "C") return one(() => setPath(k));
  if (k === "u") return one(updateScreen);
  if (k === "v") return one(() => viewReview(p));
  if (k === "r") return one(() => review(p));
  if (k === "Enter") return one(() => { state.pane = !state.pane; render(); });
  if (k === "Escape") return one(escMenu);
  if (k === "q") return one(quit);
  if (k === "/") return one(() => $("#q")?.focus());
});

/* ---------------------------------------------------------------- polling */

// ponytail: the pane's detail is a SECOND request, not part of /api/state. It costs a GitHub query per
// PR revision, so it is asked for only for the row you are looking at — and it keeps being asked while
// the server reports pending, because want_detail answers null until its background fetch lands.
async function pull() {
  const p = selected();
  if (!p || !state.pane) return;
  try {
    const r = await api(`/api/pr?url=${encodeURIComponent(p.url)}`);
    if (!r.ok) return;
    state.detail = await r.json();
    render();
    if (state.tab === "code") pullDiff();
  } catch { /* server gone; the next tick retries */ }
}
async function pullDiff() {
  const p = selected();
  if (!p || !state.pane || state.tab !== "code") return;
  try {
    const r = await api(`/api/diff?url=${encodeURIComponent(p.url)}&scope=${state.scope}&context=${state.context}`);
    if (!r.ok) return;
    const got = await r.json();
    const fresh = !state.diff || state.diff.url !== got.url || state.diff.pending;
    state.diff = got;
    render();
    if (fresh && !got.pending) scrollJump();
  } catch { /* retried by the next tick */ }
}
async function tick() {
  try {
    const r = await api("/api/state");
    if (!r.ok) return;
    state.data = await r.json();
    // ponytail: a poll lands every 2s and rewrites the page. Rewriting it under an OPEN dropdown closes
    // it mid-choice, so the repaint waits for the select to give up focus — setting() blurs it.
    if (!document.activeElement?.dataset?.set) render();
    const sel = selected();
    if (!state.detail || state.detail.pending || state.detail.url !== sel?.url) pull();
    if (state.tab === "code" && (!state.diff || state.diff.pending || state.diff.url !== sel?.url)) pullDiff();
    askConsents();
  } catch { /* server gone; the next tick retries */ }
}

render();
tick();
setInterval(tick, 2000);
setInterval(() => { if (state.data?.running || !state.data?.fetchedAt) render(); }, 500);  // the spinner and the elapsed counters
</script>
</body>
</html>
