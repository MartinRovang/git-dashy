# AT THE REPO ROOT, not beside the crate, and that is the whole point of this file's location: cargo
# discovers .cargo/config.toml from the WORKING DIRECTORY, never from --manifest-path. Under
# src-tauri/ it reached `cd src-tauri && cargo test`, which is what ci.yml runs, and missed
# `cargo test --manifest-path src-tauri/Cargo.toml` from here, which is the other normal way to run
# the suite. So the guard below was on for CI and off for anyone working from the repo root — and
# #160 was a bug that is common in the second and unreachable in the first, reported as frequent and
# reviewed as impossible, both correct. A root config is read from both (#174).
#
# The crate keeps its paths and settings in one process-global `config` (config.rs), which the UI and
# every module read. Tests that point it at a tempdir therefore cannot run beside each other, and the
# per-module test mutexes do not serialize across modules. Run the test harness single-threaded so a
# test sees one stable config for its whole body, on CI and locally alike.
[env]
RUST_TEST_THREADS = "1"

# Debug builds leave every superseded artifact behind, and cargo never collects them: a week of
# rebuilds grew target/ to 77 GiB, 35 of it incremental session state alone. Incremental buys little
# here because most rebuilds follow a dependency or config change that invalidates the cache anyway.
[build]
incremental = false
